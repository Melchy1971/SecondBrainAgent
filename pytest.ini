[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --basetemp=.pytest_tmp
pythonpath = .
markers =
    unit: fast, hermetic tests without external services
    integration: tests crossing process, network, database, optional runtime, or connector boundaries
    slow: tests that are expected to be noticeably slower than unit tests
    release: release and CI gate tests
    connector: connector adapter, runtime, transport, or sync tests
    live: opt-in tests that require real external credentials or services
    gui: tests that require GUI/display capability or GUI runtime paths
