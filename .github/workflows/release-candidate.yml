name: Release Candidate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rc-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install -c packaging/windows/constraints.txt -e ".[dev]"
      - name: System RC gate
        run: |
          python launcher.py rc-gate --write-report
          python launcher.py review-approval-release-gate

  windows-package:
    needs: rc-gate
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pinned packaging tools
        shell: pwsh
        run: |
          choco install innosetup --version=6.4.3 --no-progress -y
          choco install wixtoolset --version=3.14.1 --no-progress -y
          dotnet tool install --global wix --version 6.0.2
      - name: Build portable, installer, MSI, SBOM and checksums
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Python python
      - name: Signature preparation
        shell: pwsh
        run: Get-FileHash dist/release/* -Algorithm SHA256 | ConvertTo-Json | Set-Content dist/release/signing-subjects.json
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/release/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-candidate
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
