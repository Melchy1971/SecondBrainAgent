name: SecondBrain Release CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-gates:
    name: Release-relevant gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r requirements-security.txt

      - name: Gate version-sync drift
        run: |
          python launcher.py version-sync
          git diff --exit-code README.md docs/09_MASTERPLAN_STATUS.json

      - name: Gate repo-doctor
        run: python launcher.py repo-doctor --execute-runtime-checks

      - name: Gate dependency-inventory
        run: python launcher.py dependency-inventory

      - name: Pytest release coverage
        run: |
          pytest -q -m "release or connector" \
            tests/release tests/version \
            tests/test_repo_doctor_v18_7.py tests/test_dependency_inventory_v18_8.py \
            tests/connectors tests/test_p1_2_1_connector_incremental_runner.py \
            --cov=secondbrain.release \
            --cov=secondbrain.connectors \
            --cov=secondbrain.vault \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=35

      - name: Pytest integration boundary
        run: pytest -q -m "integration and not live" tests/integration tests/connectors_runtime tests/storage tests/vision tests/voice

      - name: Gate rc-gate
        run: python launcher.py rc-gate --write-report

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-artifacts
          path: |
            coverage.xml
            release/rc_status_latest.json
            docs/releases/v30_80_rc_report.md
          if-no-files-found: ignore
