name: SecondBrain CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secondbrain-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-smoke:
    name: Release smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development package
        run: pip install -e ".[dev]"

      - name: Prepare diagnostic output
        run: python -c "from pathlib import Path; Path('test-results').mkdir(exist_ok=True)"

      - name: Verify package imports
        run: |
          python -c "import secondbrain; import secondbrain.knowledge_graph.service; print(secondbrain.__file__)"
          python -c "from secondbrain.release.personal_jarvis_gate import run_personal_jarvis_gate; print(callable(run_personal_jarvis_gate))"

      - name: Verify generated version metadata
        run: |
          python launcher.py version-sync
          git diff --exit-code README.md docs/09_MASTERPLAN_STATUS.json

      - name: Repository doctor
        run: python launcher.py repo-doctor --execute-runtime-checks --write-report

      - name: Dependency inventory
        run: python launcher.py dependency-inventory --write-report

      - name: Release and connector tests
        run: pytest -q -m "(release or connector) and not live and not gui" --junitxml=test-results/release-connector.xml

      - name: Integration tests without live providers
        run: pytest -q -m "integration and not live and not gui" tests/integration tests/connectors_runtime tests/storage tests/vision tests/voice --junitxml=test-results/integration.xml

      - name: Knowledge graph certification
        run: |
          pytest -q tests/test_knowledge_graph_persistence.py --junitxml=test-results/knowledge-graph-persistence.xml
          pytest -q SecondBrain/knowledge_graph/tests/test_knowledge_graph.py --junitxml=test-results/knowledge-graph.xml
          python scripts/personal_jarvis_gate.py --project-root .

      - name: Release candidate gate
        run: python launcher.py rc-gate --write-report

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-reports-py${{ matrix.python-version }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            release/*.json
            runtime/reports/*.json
            test-results/**/*.xml
