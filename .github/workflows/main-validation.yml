name: Main Validation

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-validation
  cancel-in-progress: true

jobs:
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: packaging/windows/constraints.txt
      - run: python -m pip install -c packaging/windows/constraints.txt -e ".[dev]"
      - run: pytest -q -m "not live and not slow" tests

  operational-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secondbrain
          POSTGRES_PASSWORD: secondbrain-ci
          POSTGRES_DB: secondbrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secondbrain -d secondbrain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      REVIEW_APPROVAL_BACKEND: postgres
      SECOND_BRAIN_DATABASE_URL: postgresql+psycopg://secondbrain:secondbrain-ci@localhost:5432/secondbrain
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: |
          python -m pip install -c packaging/windows/constraints.txt -e ".[dev]"
          python -m pip install -c packaging/windows/constraints.txt -r requirements-db.txt
      - name: RAG and performance smoke
        shell: pwsh
        run: |
          ./scripts/rag_smoke.ps1
          python -m pytest -q tests/test_perf_load_test.py
      - name: Doctors and review approval gate
        run: |
          python launcher.py config-doctor
          python launcher.py repo-doctor --execute-runtime-checks
          python launcher.py review-approval-release-gate
