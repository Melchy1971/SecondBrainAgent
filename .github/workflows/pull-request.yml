name: Pull Request Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/windows/constraints.txt
      - name: Install locked CI tools
        run: python -m pip install -c packaging/windows/constraints.txt -e ".[dev]" ruff mypy pip-audit
      - name: Version drift and workflow policy
        run: |
          python scripts/ci_gate.py version
          python scripts/ci_gate.py workflows
      - name: Lint and type check
        run: |
          python scripts/ci_gate.py lint-diff --base "${{ github.event.pull_request.base.sha }}"
          python scripts/ci_gate.py type-diff --base "${{ github.event.pull_request.base.sha }}"
      - name: Unit and relevant integration tests
        run: |
          pytest -q -m "not integration and not live and not slow" tests
          pytest -q -m "integration and not live" tests/integration tests/storage
      - name: Secret and dependency scan
        run: |
          python scripts/ci_gate.py secrets
          pip-audit --strict
      - name: Security gate
        run: python scripts/run_hardening_tests.py
