name: P0 Reproducibility

on:
  push:
    branches:
      - main
      - sprint1-p0-reproducibility
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r requirements-security.txt

      - name: Version sync drift gate
        run: |
          python launcher.py version-sync
          git diff --exit-code README.md docs/09_MASTERPLAN_STATUS.json

      - name: Repo doctor
        run: python launcher.py repo-doctor --execute-runtime-checks

      - name: Dependency inventory
        run: python launcher.py dependency-inventory

      - name: Focused hygiene tests
        run: pytest -q -m release tests/test_repo_doctor_v18_7.py tests/test_dependency_inventory_v18_8.py tests/version
