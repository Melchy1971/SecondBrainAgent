name: Signed Stable Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Tag equals project version
        run: python scripts/ci_gate.py tag --tag "${GITHUB_REF_NAME}"
      - name: Require annotated GitHub-verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$(git cat-file -t "$TAG")" = tag
          VERIFIED=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$(git rev-parse "$TAG")" --jq '.verification.verified')
          test "$VERIFIED" = true

  artifacts:
    needs: verify-tag
    uses: ./.github/workflows/release-candidate.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  publish-stable:
    needs: artifacts
    runs-on: ubuntu-24.04
    environment: stable-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: windows-release-candidate
          path: dist/release
      - name: Verify release payload
        run: |
          cd dist/release
          sha256sum --check SHA256SUMS.txt
          test -f release-manifest.json
          test -f RELEASE_NOTES.md
          test -n "$(find . -name '*sbom.cdx.json' -print -quit)"
      - name: Publish stable release after environment approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/release/* --verify-tag --title "Jarvis ${GITHUB_REF_NAME}" --notes-file dist/release/RELEASE_NOTES.md
