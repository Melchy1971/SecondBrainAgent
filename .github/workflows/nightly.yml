name: Nightly Resilience

on:
  schedule:
    - cron: "31 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resilience:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install -c packaging/windows/constraints.txt -e ".[dev,connectors]"
      - name: Full integration and connector fakes
        run: pytest -q -m "integration and not live" tests/integration tests/connectors tests/connectors_runtime tests/storage
      - name: Backup restore and small load profile
        run: |
          python scripts/backup_restore_test.py
          pytest -q tests/test_perf_load_test.py
      - name: Corrupt queue and recovery
        run: pytest -q tests/test_approval_inbox_gui.py tests/test_review_approval_e2e.py tests/test_review_approval_concurrency.py
      - name: Update simulation
        shell: pwsh
        run: ./scripts/update_simulated.ps1
