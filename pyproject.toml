[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secondbrain-agent"
version = "31.94.0"
description = "Local modular SecondBrain/Jarvis runtime with RAG, desktop, mobile, voice and release gates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Markus Dickscheit" }]
dependencies = [
  "cryptography>=46.0.3",
  "ijson>=3.2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]
pdf = [
  "PyMuPDF>=1.24.0",
  "pypdf>=5.0.0",
]
connectors = [
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
]
openai = [
  "openai>=1.40.0",
]
desktop = [
  "PySide6>=6.8.0",
  "psutil>=5.9.0",
  "pystray>=0.19.5",
  "Pillow>=10.0.0",
  "pynput>=1.7.7",
]
voice = [
  "SpeechRecognition>=3.10.0",
  "pyttsx3>=2.90",
  "sounddevice>=0.4.6",
]
voice-offline = [
  "faster-whisper>=1.0.0",
  "vosk>=0.3.45",
]
office = [
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
]
images = [
  "Pillow>=10.0.0",
]
ocr = [
  "pytesseract>=0.3.10",
  "Pillow>=10.0.0",
]
dnd = [
  "tkinterdnd2>=0.4.0",
]
all = [
  "ijson>=3.2.3",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "PyMuPDF>=1.24.0",
  "pypdf>=5.0.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "openai>=1.40.0",
  "PySide6>=6.8.0",
  "psutil>=5.9.0",
  "SpeechRecognition>=3.10.0",
  "pyttsx3>=2.90",
  "sounddevice>=0.4.6",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "Pillow>=10.0.0",
  "pytesseract>=0.3.10",
  "tkinterdnd2>=0.4.0",
]

[project.scripts]
secondbrain = "launcher:main"

[tool.setuptools]
py-modules = ["launcher", "secondbrain"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["SecondBrain", "SecondBrain.*"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
"SecondBrain.storage" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --basetemp=.pytest_tmp"
markers = [
  "unit: fast, hermetic tests without external services",
  "integration: tests crossing process, network, database, optional runtime, or connector boundaries",
  "slow: tests that are expected to be noticeably slower than unit tests",
  "release: release and CI gate tests",
  "connector: connector adapter, runtime, transport, or sync tests",
  "live: opt-in tests that require real external credentials or services",
  "gui: tests that require GUI/display capability or GUI runtime paths",
]

[tool.coverage.run]
branch = true
source = ["secondbrain"]
omit = [
  "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 35

[tool.coverage.xml]
output = "coverage.xml"
